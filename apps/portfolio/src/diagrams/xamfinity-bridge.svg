<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flutter와 WebView 사이의 브리지 구조, 그리고 Remote Config·Crashlytics 연결">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79" />
    </marker>
  </defs>

  <!-- Flutter shell -->
  <rect x="0" y="14" width="300" height="180" rx="8" class="dg-box-soft" />
  <text x="150" y="32" class="dg-label">Flutter (iOS · Android 단일 코드)</text>
  <rect x="16" y="50" width="130" height="38" rx="6" class="dg-box" />
  <text x="81" y="69" class="dg-text">인앱결제</text>
  <rect x="156" y="50" width="130" height="38" rx="6" class="dg-box" />
  <text x="221" y="69" class="dg-text">푸시 (FCM)</text>
  <rect x="16" y="100" width="130" height="38" rx="6" class="dg-box" />
  <text x="81" y="119" class="dg-text">Kiosk · 자동 업데이트</text>
  <rect x="156" y="100" width="130" height="38" rx="6" class="dg-box" />
  <text x="221" y="119" class="dg-text">WebView 컨테이너</text>
  <text x="150" y="176" class="dg-label">네이티브 권한·결제·알림처럼 웹으로 안 되는 것만</text>

  <!-- bridge -->
  <path d="M302,84 L418,84" class="dg-line" />
  <text x="360" y="72" class="dg-label">MethodChannel</text>
  <text x="360" y="96" class="dg-label">네이티브 → 웹 호출</text>
  <path d="M418,134 L302,134" class="dg-line" />
  <text x="360" y="122" class="dg-label">EventChannel</text>
  <text x="360" y="146" class="dg-label">웹 → 네이티브 이벤트</text>

  <!-- Web -->
  <rect x="420" y="14" width="300" height="180" rx="8" class="dg-box-soft" />
  <text x="570" y="32" class="dg-label">React 모바일 웹 (WebView 안)</text>
  <rect x="436" y="50" width="268" height="30" rx="6" class="dg-box" />
  <text x="570" y="65" class="dg-text">출결 · 수납 · 공지 · 상담 화면</text>
  <rect x="436" y="88" width="268" height="30" rx="6" class="dg-box" />
  <text x="570" y="103" class="dg-text">TanStack Query · Recoil</text>
  <rect x="436" y="126" width="268" height="30" rx="6" class="dg-box" />
  <text x="570" y="141" class="dg-text">Vanilla Extract CSS</text>
  <text x="570" y="176" class="dg-label">화면과 비즈니스 로직. 배포는 웹만 다시 하면 된다</text>

  <!-- Firebase — 앱 밖에서 바꾸고, 앱 밖에서 지켜보는 것 -->
  <path d="M150,236 L150,202" class="dg-line" />
  <text x="238" y="216" class="dg-label">WebView URL · 기능 플래그</text>
  <path d="M300,200 L455,234" class="dg-line" />
  <path d="M620,200 L545,234" class="dg-line" />
  <text x="500" y="216" class="dg-label">양쪽 예외 수집</text>
  <rect x="40" y="236" width="220" height="42" rx="6" class="dg-box-soft" />
  <text x="150" y="252" class="dg-text">Remote Config</text>
  <text x="150" y="268" class="dg-label">스토어 심사 없이 바꾸는 값</text>
  <rect x="390" y="236" width="220" height="42" rx="6" class="dg-box-soft" />
  <text x="500" y="252" class="dg-text">Crashlytics</text>
  <text x="500" y="268" class="dg-label">앱·웹 예외를 한곳으로</text>
</svg>
